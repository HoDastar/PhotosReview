<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .file-upload {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 10px 14px;
            border-radius: 12px;
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.12);

            width: fit-content;
        }

        /* ✅隐藏原生 input */
        .file-upload input[type="file"] {
            display: none;
        }

        /* ✅自定义按钮 */
        .file-btn {
            padding: 10px 16px;
            border-radius: 10px;
            background: #2a98ff;
            color: white;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.2s;
        }

        /* hover效果 */
        .file-btn:hover {
            background: #2563eb;
        }

        /* 点击按下 */
        .file-btn:active {
            transform: scale(0.96);
        }

        /* 文件名显示 */
        .file-name {
            font-size: 14px;
            color: #444;
            max-width: 220px;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* 图片缩略图 */
        .file-preview {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>
    <div class="file-upload">
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png" />

        <label for="fileInput" class="file-btn">
            📁 选择文件
        </label>

        <span class="file-name" id="fileName">
            未选择任何文件
        </span>
    </div>
    <button onclick="clearFile()">清除</button>

</body>

</html>
<script>

    



    const fileInput = document.getElementById("fileInput");
    const fileNameEl = document.getElementById("fileName");
    const allowed = ["jpg", "png", "jpeg"];

    fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
            const fileName = fileInput.files[0].name;
            const fileType = fileName.split(".").pop().toLowerCase();
            // ❌不合法
            if (!allowed.includes(fileType)) {
                alert("❌文件类型不允许：" + fileType);
                input.value = ""; // 清空选择
                return;
            }
            fileNameEl.textContent = '';
            const img = document.createElement("img");
            fileNameEl.appendChild(img);

            const reader = new FileReader();

            reader.onload = function (e) {
                img.src = e.target.result;
                img.style.display = "block"; // 显示图片
                img.classList.add("file-preview");
            };

            reader.readAsDataURL(fileInput.files[0]); // 转 base64 显示
            
        }
    });
    function clearFile() {
        fileInput.value = "";
        fileNameEl.textContent = "未选择任何文件";
    }
</script>
